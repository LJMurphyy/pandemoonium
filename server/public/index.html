<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#162338"><title>PandeMOOnium Controller</title><link rel="stylesheet" href="/style.css"></head>
<body><main><header><h1>🐮 PandeMOOnium</h1><p>Multiplayer phone controller</p></header>
<section id="joinPanel" class="panel"><label for="roomCode">Room code</label><input id="roomCode" maxlength="6" placeholder="ABC123" autocomplete="off" autocapitalize="characters"><button id="joinBtn">Join game</button><p id="joinStatus" role="status">Use the same Wi-Fi as the game host.</p></section>
<section id="controller" class="panel" hidden><div class="topline"><strong id="playerLabel">Player</strong><span id="roomLabel"></span></div><p id="status" role="status">Connected</p><div id="roster" class="roster"></div><div id="readyPanel"><button id="readyBtn">I'm Ready</button><p class="tip">The host can start when 2–4 players are ready.</p></div>
<div id="playPanel" hidden><div class="controls"><div id="joystick" aria-label="Virtual joystick" role="application"><div id="stick"></div></div><div class="actionColumn"><button id="actionBtn">INTERACT</button><button id="sabotageBtn" hidden>SABOTAGE</button></div></div><p class="tip">Drag the joystick to move in any direction. Tap INTERACT near a station.</p></div>
<button id="leaveBtn" class="secondary">Leave room</button></section></main><script src="/controller.js"></script></body></html>
